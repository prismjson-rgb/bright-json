name = "prism-short"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "8294e44ced7d8f156440f89cc13b1bd4"

# Custom domain — KV-backed short links at https://s.jsonprism.com/<slug>.
# `custom_domain = true` tells Cloudflare to provision TLS and route the entire
# hostname to this Worker (no route pattern + DNS gymnastics required).
[[routes]]
pattern = "s.jsonprism.com"
custom_domain = true

[[kv_namespaces]]
binding = "SHORT_LINKS"
id = "4c864c997c894ae8bbf2547253fb0d47"

[vars]
SITE_URL = "https://jsonprism.com"
ALLOWED_ORIGIN = "https://jsonprism.com"
# "test_mode" or "live_mode" — the provided API key is a live-mode key, so this
# is live_mode. Real charges happen when /donate is hit.
DODO_ENVIRONMENT = "live_mode"
DODO_DONATE_PRODUCT_ID = "pdt_0Nn1NzRGNxaV1e9XQbkfl"

# DODO_API_KEY is a secret, not a var — set it with:
#   wrangler secret put DODO_API_KEY
# (never commit it here)
