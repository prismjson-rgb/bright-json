name: Validate and deploy Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix worker
      - run: npm run check
      - run: npm run typecheck --prefix worker
      - run: npm run build:production
      - run: npm run verify:export
      - run: npm run deploy:check
      - run: npm run deploy:check --prefix worker
      - run: npx wrangler deploy --config redirect/wrangler.jsonc --env production --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: out
          retention-days: 14
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://jsonprism.com
    env:
      HUSKY: '0'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - uses: actions/download-artifact@v4
        with:
          name: production-site
          path: out
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm run deploy:production --prefix worker
      - run: npx wrangler deploy --env production
      - run: npx wrangler deploy --config redirect/wrangler.jsonc --env production
      - name: Verify live deployment and commit
        run: node scripts/verify-deployment.mjs
