<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">Sorting JSON keys alphabetically</title>
  <desc id="d">Sorting object keys alphabetically produces a deterministic order, which makes diffs smaller and avoids merge conflicts.</desc>
  <rect width="760" height="340" rx="16" fill="#090d17"/>

  <!-- Left: unsorted -->
  <rect x="32" y="44" width="320" height="252" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="52" y="76" fill="#fb7185" font-size="13" letter-spacing="1.5" font-weight="700">UNSORTED</text>
  <g font-size="14.5">
    <text x="52" y="116"><tspan fill="#64748b">{</tspan></text>
    <text x="72" y="144"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Ada"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="72" y="172"><tspan fill="#67e8f9">"age"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#fcd34d">36</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="72" y="200"><tspan fill="#67e8f9">"city"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Paris"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="72" y="228"><tspan fill="#67e8f9">"active"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#fcd34d">true</tspan></text>
    <text x="52" y="256"><tspan fill="#64748b">}</tspan></text>
  </g>

  <!-- Arrow -->
  <g stroke="#22d3ee" stroke-width="2" fill="none">
    <path d="M364 170 H396"/>
    <path d="M388 162 l8 8 l-8 8"/>
  </g>
  <text x="380" y="148" fill="#94a3b8" font-size="11" text-anchor="middle">sort A→Z</text>

  <!-- Right: sorted -->
  <rect x="408" y="44" width="320" height="252" rx="14" fill="#0d1322" stroke="rgba(34,211,238,0.30)"/>
  <text x="428" y="76" fill="#22d3ee" font-size="13" letter-spacing="1.5" font-weight="700">SORTED</text>
  <g font-size="14.5">
    <text x="428" y="116"><tspan fill="#64748b">{</tspan></text>
    <text x="448" y="144"><tspan fill="#67e8f9">"active"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#fcd34d">true</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="448" y="172"><tspan fill="#67e8f9">"age"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#fcd34d">36</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="448" y="200"><tspan fill="#67e8f9">"city"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Paris"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="448" y="228"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Ada"</tspan></text>
    <text x="428" y="256"><tspan fill="#64748b">}</tspan></text>
  </g>

  <text x="380" y="320" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Deterministic key order → smaller git diffs and fewer merge conflicts</text>
</svg>
