<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">null versus missing key versus empty string</title>
  <desc id="d">Three distinct states for a JSON field: an explicit null value, a key that is absent entirely, and a present key holding an empty string.</desc>
  <rect width="760" height="320" rx="16" fill="#090d17"/>

  <!-- col 1: null -->
  <rect x="28" y="44" width="224" height="200" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="46" y="76" fill="#fcd34d" font-size="13" letter-spacing="1.5" font-weight="700">EXPLICIT null</text>
  <g font-size="14.5">
    <text x="46" y="118"><tspan fill="#64748b">{</tspan></text>
    <text x="66" y="146"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#fcd34d">null</tspan></text>
    <text x="46" y="174"><tspan fill="#64748b">}</tspan></text>
  </g>
  <text x="46" y="214" fill="#94a3b8" font-size="11.5">Key exists.</text>
  <text x="46" y="232" fill="#94a3b8" font-size="11.5">Value is known to be empty.</text>

  <!-- col 2: missing -->
  <rect x="268" y="44" width="224" height="200" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="286" y="76" fill="#fb7185" font-size="13" letter-spacing="1.5" font-weight="700">KEY ABSENT</text>
  <g font-size="14.5">
    <text x="286" y="118"><tspan fill="#64748b">{</tspan></text>
    <text x="306" y="146" fill="#475569" font-style="italic">(no "name")</text>
    <text x="286" y="174"><tspan fill="#64748b">}</tspan></text>
  </g>
  <text x="286" y="214" fill="#94a3b8" font-size="11.5">Key does not exist.</text>
  <text x="286" y="232" fill="#94a3b8" font-size="11.5">Value is unknown / not sent.</text>

  <!-- col 3: empty string -->
  <rect x="508" y="44" width="224" height="200" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="526" y="76" fill="#6ee7b7" font-size="13" letter-spacing="1.5" font-weight="700">EMPTY STRING</text>
  <g font-size="14.5">
    <text x="526" y="118"><tspan fill="#64748b">{</tspan></text>
    <text x="546" y="146"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">""</tspan></text>
    <text x="526" y="174"><tspan fill="#64748b">}</tspan></text>
  </g>
  <text x="526" y="214" fill="#94a3b8" font-size="11.5">Key exists.</text>
  <text x="526" y="232" fill="#94a3b8" font-size="11.5">Value is a real, blank string.</text>

  <text x="380" y="288" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Three different states — don't treat them as interchangeable in your schema or code</text>
</svg>
