<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">JSON big-number precision loss</title>
  <desc id="d">JavaScript numbers are safe only up to 2 to the 53rd minus 1. Larger integers in JSON, such as 64-bit IDs, lose precision when parsed, so they should be sent as strings.</desc>
  <rect width="760" height="320" rx="16" fill="#090d17"/>

  <text x="40" y="54" fill="#22d3ee" font-size="13" letter-spacing="1.5" font-weight="700">THE SAFE-INTEGER BOUNDARY</text>

  <!-- number line -->
  <line x1="40" y1="120" x2="720" y2="120" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="430" y1="100" x2="430" y2="140" stroke="#fcd34d" stroke-width="2"/>
  <text x="430" y="92" fill="#fcd34d" font-size="12.5" text-anchor="middle" font-weight="600">2⁵³ − 1  ( 9007199254740991 )</text>

  <!-- safe zone -->
  <rect x="40" y="106" width="390" height="28" fill="rgba(110,231,183,0.10)"/>
  <text x="60" y="162" fill="#6ee7b7" font-size="12.5" font-weight="600">SAFE — exact integers</text>

  <!-- unsafe zone -->
  <rect x="430" y="106" width="290" height="28" fill="rgba(251,113,133,0.10)"/>
  <text x="560" y="162" fill="#fb7185" font-size="12.5" font-weight="600" text-anchor="middle">UNSAFE — precision lost</text>

  <!-- example -->
  <g font-size="15">
    <text x="40" y="220"><tspan fill="#64748b">JSON in: </tspan><tspan fill="#cbd5e1">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#fcd34d">12345678901234567</tspan><tspan fill="#cbd5e1">}</tspan></text>
    <text x="40" y="252"><tspan fill="#64748b">parsed:  </tspan><tspan fill="#fb7185">12345678901234568</tspan>  <tspan fill="#fb7185" font-size="12">← last digit changed</tspan></text>
  </g>

  <text x="40" y="296" fill="#6ee7b7" font-size="12.5">Fix: send large IDs as strings — "id": "12345678901234567" — or use BigInt</text>
</svg>
