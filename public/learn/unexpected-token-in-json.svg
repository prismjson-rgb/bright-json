<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">Unexpected token in JSON</title>
  <desc id="d">When a server returns an HTML error page instead of JSON, the parser meets a less-than sign at position zero and throws Unexpected token.</desc>
  <rect width="760" height="300" rx="16" fill="#090d17"/>

  <text x="40" y="52" fill="#fb7185" font-size="13" letter-spacing="1.5" font-weight="700">EXPECTED JSON — GOT HTML</text>

  <!-- the source string with position ruler -->
  <g font-size="22" font-weight="600">
    <text x="40" y="120"><tspan fill="#fb7185">&lt;</tspan><tspan fill="#cbd5e1">!doctype html&gt;&lt;html&gt;...</tspan></text>
  </g>

  <!-- caret under first char -->
  <text x="46" y="148" fill="#22d3ee" font-size="20" text-anchor="middle" font-weight="700">▲</text>
  <line x1="46" y1="158" x2="46" y2="186" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="182" fill="#22d3ee" font-size="12.5">position 0 — the very first character</text>

  <!-- error box -->
  <rect x="40" y="206" width="680" height="44" rx="10" fill="rgba(251,113,133,0.08)" stroke="rgba(251,113,133,0.30)"/>
  <text x="58" y="234" fill="#fb7185" font-size="14">SyntaxError: Unexpected token '&lt;', "&lt;!doctype "... is not valid JSON</text>

  <text x="40" y="282" fill="#94a3b8" font-size="12.5">The "&lt;" means the response was an HTML error page (404/500), not JSON — check the URL, status, and Content-Type.</text>
</svg>
