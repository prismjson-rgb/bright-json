<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">Reading a JSON parse error position</title>
  <desc id="d">The position number in a JSON error is a zero-based character index into the raw string, pointing at or just after the character that broke parsing.</desc>
  <rect width="760" height="300" rx="16" fill="#090d17"/>

  <text x="40" y="50" fill="#22d3ee" font-size="13" letter-spacing="1.5" font-weight="700">POSITION = CHARACTER INDEX (0-BASED)</text>

  <!-- string with per-char index ruler -->
  <g font-size="20" font-weight="600" letter-spacing="6">
    <text x="40" y="112" fill="#cbd5e1">{<tspan fill="#67e8f9">"a"</tspan>:<tspan fill="#fcd34d">1</tspan> <tspan fill="#fb7185">"b"</tspan>:<tspan fill="#fcd34d">2</tspan>}</text>
  </g>

  <!-- index numbers under chars -->
  <g font-size="11" fill="#475569" letter-spacing="0">
    <text x="40"  y="138">0</text>
    <text x="66"  y="138">1</text>
    <text x="92"  y="138">2</text>
    <text x="118" y="138">3</text>
    <text x="144" y="138">4</text>
    <text x="170" y="138">5</text>
    <text x="196" y="138">6</text>
    <text x="222" y="138">7</text>
  </g>

  <!-- caret at position 6 (the second quote) -->
  <text x="200" y="166" fill="#fb7185" font-size="18" font-weight="700">▲</text>
  <line x1="204" y1="174" x2="204" y2="200" stroke="#fb7185" stroke-width="1.5"/>
  <text x="40" y="218" fill="#fb7185" font-size="13">"Unexpected string in JSON at position 6" → a comma is missing before "b"</text>

  <text x="40" y="262" fill="#94a3b8" font-size="12.5">Count characters from 0. The break is usually at — or one before — the reported index.</text>
  <text x="40" y="282" fill="#94a3b8" font-size="12.5">Newlines count as one character too.</text>
</svg>
