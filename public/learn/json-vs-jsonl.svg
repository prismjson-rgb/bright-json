<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">JSON versus JSONL</title>
  <desc id="d">A single JSON document holds one array spanning multiple lines, while JSONL stores one self-contained JSON object per line as a stream of records.</desc>
  <rect width="760" height="360" rx="16" fill="#090d17"/>

  <!-- Left: JSON -->
  <rect x="32" y="40" width="320" height="280" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="52" y="74" fill="#22d3ee" font-size="13" letter-spacing="2" font-weight="700">JSON</text>
  <text x="52" y="92" fill="#64748b" font-size="11">one document</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="52" y="138"><tspan fill="#64748b">[</tspan></text>
    <text x="76" y="166"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">1</tspan><tspan fill="#64748b">},</tspan></text>
    <text x="76" y="194"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">2</tspan><tspan fill="#64748b">},</tspan></text>
    <text x="76" y="222"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">3</tspan><tspan fill="#64748b">}</tspan></text>
    <text x="52" y="250"><tspan fill="#64748b">]</tspan></text>
  </g>
  <text x="52" y="298" fill="#94a3b8" font-size="11.5">Parse the whole file at once</text>

  <!-- Arrow -->
  <g stroke="#22d3ee" stroke-width="2" fill="none">
    <path d="M364 180 H396"/>
    <path d="M388 172 l8 8 l-8 8"/>
  </g>

  <!-- Right: JSONL -->
  <rect x="408" y="40" width="320" height="280" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="428" y="74" fill="#6ee7b7" font-size="13" letter-spacing="2" font-weight="700">JSONL · NDJSON</text>
  <text x="428" y="92" fill="#64748b" font-size="11">one record per line</text>
  <g font-size="15">
    <text x="428" y="138"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">1</tspan><tspan fill="#64748b">}</tspan></text>
    <text x="428" y="166"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">2</tspan><tspan fill="#64748b">}</tspan></text>
    <text x="428" y="194"><tspan fill="#64748b">{</tspan><tspan fill="#67e8f9">"id"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fcd34d">3</tspan><tspan fill="#64748b">}</tspan></text>
  </g>
  <g stroke="rgba(110,231,183,0.35)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M428 150 H700"/>
    <path d="M428 178 H700"/>
  </g>
  <text x="428" y="232" fill="#6ee7b7" font-size="11.5">← newline-delimited, streamable</text>
  <text x="428" y="298" fill="#94a3b8" font-size="11.5">Read line by line; append safely</text>
</svg>
