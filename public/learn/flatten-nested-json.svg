<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">Flattening nested JSON</title>
  <desc id="d">A nested JSON object is converted into a flat object whose keys are dotted paths such as user.address.city.</desc>
  <rect width="760" height="360" rx="16" fill="#090d17"/>

  <!-- Left: nested -->
  <rect x="32" y="40" width="320" height="280" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="52" y="72" fill="#22d3ee" font-size="13" letter-spacing="2" font-weight="700">NESTED</text>
  <g font-size="14.5">
    <text x="52" y="110"><tspan fill="#64748b">{</tspan></text>
    <text x="72" y="136"><tspan fill="#67e8f9">"user"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="92" y="162"><tspan fill="#67e8f9">"name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Ada"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="92" y="188"><tspan fill="#67e8f9">"address"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="112" y="214"><tspan fill="#67e8f9">"city"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Paris"</tspan></text>
    <text x="92" y="240"><tspan fill="#64748b">}</tspan></text>
    <text x="72" y="266"><tspan fill="#64748b">}</tspan></text>
    <text x="52" y="292"><tspan fill="#64748b">}</tspan></text>
  </g>

  <!-- Arrow -->
  <g stroke="#22d3ee" stroke-width="2" fill="none">
    <path d="M364 180 H396"/>
    <path d="M388 172 l8 8 l-8 8"/>
  </g>
  <text x="380" y="158" fill="#94a3b8" font-size="11" text-anchor="middle">flatten</text>

  <!-- Right: flat -->
  <rect x="408" y="40" width="320" height="280" rx="14" fill="#0d1322" stroke="rgba(255,255,255,0.10)"/>
  <text x="428" y="72" fill="#6ee7b7" font-size="13" letter-spacing="2" font-weight="700">FLAT · DOTTED KEYS</text>
  <g font-size="13.5">
    <text x="428" y="116"><tspan fill="#64748b">{</tspan></text>
    <text x="448" y="146"><tspan fill="#67e8f9">"user.name"</tspan><tspan fill="#64748b">:</tspan> <tspan fill="#6ee7b7">"Ada"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="448" y="176"><tspan fill="#67e8f9">"user.address.city"</tspan><tspan fill="#64748b">:</tspan></text>
    <text x="468" y="200"><tspan fill="#6ee7b7">"Paris"</tspan></text>
    <text x="428" y="230"><tspan fill="#64748b">}</tspan></text>
  </g>
  <text x="428" y="284" fill="#94a3b8" font-size="11.5">Each leaf becomes one key →</text>
  <text x="428" y="302" fill="#94a3b8" font-size="11.5">its full path, joined by dots</text>
</svg>
