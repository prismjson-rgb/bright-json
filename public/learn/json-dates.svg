<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t">Anatomy of an ISO 8601 date-time string</title>
  <desc id="d">The string 2026-06-25T14:30:00Z breaks into a date, a T separator, a time, and a Z that denotes UTC.</desc>
  <rect width="760" height="320" rx="16" fill="#090d17"/>

  <text x="380" y="56" fill="#22d3ee" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">ISO 8601 · RFC 3339</text>

  <!-- the string, monospace, centered, big -->
  <g font-size="30" font-weight="600" text-anchor="middle">
    <text x="380" y="150">
      <tspan fill="#67e8f9">2026-06-25</tspan><tspan fill="#fb7185">T</tspan><tspan fill="#fcd34d">14:30:00</tspan><tspan fill="#6ee7b7">Z</tspan>
    </text>
  </g>

  <!-- brackets / labels -->
  <g stroke-width="1.5" fill="none">
    <path d="M250 168 V182 H360 V168" stroke="#67e8f9"/>
    <path d="M372 168 V182 H386 V168" stroke="#fb7185"/>
    <path d="M398 168 V182 H486 V168" stroke="#fcd34d"/>
    <path d="M498 168 V182 H512 V168" stroke="#6ee7b7"/>
  </g>

  <g font-size="12.5" text-anchor="middle">
    <text x="305" y="210" fill="#67e8f9" font-weight="600">date</text>
    <text x="305" y="228" fill="#94a3b8">YYYY-MM-DD</text>

    <text x="379" y="210" fill="#fb7185" font-weight="600">T</text>
    <text x="379" y="228" fill="#94a3b8">separator</text>

    <text x="442" y="210" fill="#fcd34d" font-weight="600">time</text>
    <text x="442" y="228" fill="#94a3b8">HH:MM:SS</text>

    <text x="505" y="210" fill="#6ee7b7" font-weight="600">Z</text>
    <text x="505" y="228" fill="#94a3b8">UTC</text>
  </g>

  <text x="380" y="278" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Store dates as a string in this format: unambiguous, sortable, and parsed by Date()</text>
</svg>
