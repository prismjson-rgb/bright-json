# DigitalOcean App Platform — force static site (Next.js static export)
# See: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
name: bright-json
static_sites:
  - name: bright-json
    environment_slug: node-js
    build_command: npm run build
    output_dir: out
    index_document: index.html
    error_document: 404.html
    envs:
      - key: NEXT_PUBLIC_SHORTENER_URL
        scope: BUILD_TIME
        value: https://s.jsonprism.com
